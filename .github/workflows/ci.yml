name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macOS runner: voicepipe uses cgo (CoreAudio/CoreGraphics), so it can't
    # build on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
